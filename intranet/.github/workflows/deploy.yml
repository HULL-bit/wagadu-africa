name: Deploy

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      registry: ${{ steps.vars.outputs.registry }}
    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: |
          echo "tag=${{ github.ref == 'refs/heads/main' && 'latest' || 'staging' }}" >> "$GITHUB_OUTPUT"
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "registry=ghcr.io/$owner" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.vars.outputs.registry }}/wagadu-hub-backend:${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: NEXT_PUBLIC_API_BASE_URL=/api/v1
          tags: ${{ steps.vars.outputs.registry }}/wagadu-hub-frontend:${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    # Activé en posant la variable de dépôt DEPLOY_ENABLED=true (une fois le
    # serveur provisionné et les secrets SERVER_* / DEPLOY_PATH renseignés).
    # Tant qu'elle est absente, ce job est ignoré (et non « en échec »).
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      - name: Déploiement SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: IMAGE_TAG,REGISTRY
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            git pull --ff-only
            export IMAGE_TAG=${{ needs.build-push.outputs.tag }}
            export REGISTRY=${{ needs.build-push.outputs.registry }}
            docker compose -f infra/docker-compose.yml pull backend frontend
            docker compose -f infra/docker-compose.yml up -d
            docker compose -f infra/docker-compose.yml run --rm backend python manage.py migrate --noinput

      - name: Notification de déploiement
        if: always()
        run: echo "Déploiement ${{ job.status }} sur ${{ github.ref_name }}"
        # curl -X POST "$ROCKETCHAT_WEBHOOK" -d "{\"text\": \"Déploiement ${{ job.status }}\"}"
