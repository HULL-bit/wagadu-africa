name: wagadu-website-dev

# Développement local uniquement — fait tourner TOUT le projet (site public +
# Directus + Hub/intranet) via un seul `docker compose`, plus Nginx en frontal
# avec un sous-domaine par service (remplace l'essai Kubernetes/kind — même
# topologie, cf. l'ancien dossier k8s/, mais sans le coût d'un cluster local).
#
#   docker compose -f infra/docker-compose.dev.yml up -d
#
# Le site tourne ici en mode dev (`npm run dev` dans le conteneur, code monté
# en volume, hot-reload) plutôt qu'avec le Dockerfile de prod (build figé) :
# ça évite le problème d'ordre "Directus doit déjà tourner pour le build SSG"
# puisqu'en dev Next.js fait son fetch par requête, pas au build.
#
# Résolution des sous-domaines : ajouter à /etc/hosts —
#   127.0.0.1  wagadu.local cms.wagadu.local intranet.wagadu.local

services:
  # ─── Directus (site public) ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wagadu_cms
      POSTGRES_USER: directus
      POSTGRES_PASSWORD: directus_dev
    ports:
      - "55432:5432"
    volumes:
      - dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U directus -d wagadu_cms"]
      interval: 5s
      timeout: 5s
      retries: 10

  directus:
    image: directus/directus:11
    restart: unless-stopped
    ports:
      - "8055:8055"
    environment:
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: wagadu_cms
      DB_USER: directus
      DB_PASSWORD: directus_dev
      KEY: dev-key-not-for-prod
      SECRET: dev-secret-not-for-prod
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:-admin@wagadu-africa.org}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:-wagadu-dev-admin}
      PUBLIC_URL: http://cms.wagadu.local
      WEBSOCKETS_ENABLED: "true"
      CORS_ENABLED: "true"
      CORS_ORIGIN: "true"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8055/server/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - dev_uploads:/directus/uploads

  site:
    image: node:22-alpine
    working_dir: /app
    restart: unless-stopped
    env_file: ../site/.env.local
    environment:
      # Écrase la valeur de .env.local (pensée pour un accès depuis l'hôte) —
      # depuis le conteneur, Directus se joint par son nom de service.
      DIRECTUS_URL: http://directus:8055
      # Sur Linux, les événements inotify du système de fichiers hôte ne
      # remontent pas de façon fiable à travers un bind mount Docker — sans
      # ça, webpack ne voit jamais les modifs et sert un bundle figé tant que
      # le conteneur n'est pas relancé à la main (symptôme : CSS manquant,
      # changements invisibles sans rafraîchissement). Le polling contourne
      # le problème. Même principe déjà en place côté intranet-frontend.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    command: sh -c "npm ci --prefer-offline --no-audit || npm install --no-save; npm run dev"
    ports:
      - "3000:3000"
    volumes:
      - ../site:/app
      - dev_site_node_modules:/app/node_modules
      - dev_site_next:/app/.next
    depends_on:
      # `condition: service_healthy` (pas juste "le conteneur a démarré") —
      # sans ça, le site tente ses premières requêtes Directus avant que
      # l'appli Directus ait fini de démarrer, le fetch échoue, et
      # app/[locale]/error.tsx affiche "Something went wrong" jusqu'à ce
      # qu'un rechargement tombe au bon moment et peuple le cache. Bug
      # constaté et corrigé ici plutôt que côté site (symptôme : erreurs
      # intermittentes au premier chargement après un démarrage de la stack).
      directus:
        condition: service_healthy

  # ─── Hub / intranet (Django + Next.js) ─────────────────────────────────
  postgres-hub:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wagadu
      POSTGRES_USER: wagadu
      POSTGRES_PASSWORD: wagadu_dev
    ports:
      - "55433:5432"
    volumes:
      - dev_hub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagadu -d wagadu"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - dev_redisdata:/data

  intranet-backend:
    build: ../intranet/backend
    restart: unless-stopped
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: wagadu.settings.dev
      DJANGO_SECRET_KEY: dev-django-secret-key-not-for-prod-please-change
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "*"
      DJANGO_TIME_ZONE: Africa/Dakar
      USE_SQLITE: "0"
      POSTGRES_DB: wagadu
      POSTGRES_USER: wagadu
      POSTGRES_PASSWORD: wagadu_dev
      POSTGRES_HOST: postgres-hub
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: "http://intranet.wagadu.local"
      DJANGO_CSRF_TRUSTED_ORIGINS: "http://intranet.wagadu.local"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/schema/"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 40s
    depends_on:
      postgres-hub:
        condition: service_healthy
      redis:
        condition: service_started

  intranet-celery-worker:
    build: ../intranet/backend
    restart: unless-stopped
    entrypoint: []
    command: celery -A wagadu worker -l info
    environment:
      DJANGO_SETTINGS_MODULE: wagadu.settings.dev
      DJANGO_SECRET_KEY: dev-django-secret-key-not-for-prod-please-change
      USE_SQLITE: "0"
      POSTGRES_DB: wagadu
      POSTGRES_USER: wagadu
      POSTGRES_PASSWORD: wagadu_dev
      POSTGRES_HOST: postgres-hub
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      intranet-backend:
        condition: service_healthy

  intranet-celery-beat:
    build: ../intranet/backend
    restart: unless-stopped
    entrypoint: []
    command: celery -A wagadu beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      DJANGO_SETTINGS_MODULE: wagadu.settings.dev
      DJANGO_SECRET_KEY: dev-django-secret-key-not-for-prod-please-change
      USE_SQLITE: "0"
      POSTGRES_DB: wagadu
      POSTGRES_USER: wagadu
      POSTGRES_PASSWORD: wagadu_dev
      POSTGRES_HOST: postgres-hub
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      intranet-backend:
        condition: service_healthy

  intranet-frontend:
    build:
      context: ../intranet/frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: /api/v1
    restart: unless-stopped
    command: node server.js
    ports:
      - "3300:3000"
    environment:
      NODE_ENV: production
      INTERNAL_API_URL: http://intranet-backend:8000
    depends_on:
      intranet-backend:
        condition: service_healthy

  # ─── Nginx — un sous-domaine par service, tout par nom de service Docker
  # maintenant que le site est lui aussi conteneurisé ────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - site
      - directus
      - intranet-backend
      - intranet-frontend

volumes:
  dev_pgdata:
  dev_uploads:
  dev_hub_pgdata:
  dev_redisdata:
  dev_site_node_modules:
  dev_site_next:
