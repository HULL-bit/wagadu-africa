# Reverse-proxy de développement — un sous-domaine par service, HTTP simple
# sur :80 (pas de TLS, remplace l'Ingress nginx utilisé dans l'essai
# Kubernetes/kind : même répartition de trafic, cf. ancien k8s/30-ingress.yaml).
# Nginx est sur le même réseau Docker que les autres services
# (docker-compose.dev.yml) : chaque backend est donc joint par son nom de
# service, jamais par un port publié sur l'hôte.
#
# `proxy_pass` pointe vers une variable (pas une URL en dur) + `resolver`
# explicite sur le DNS interne de Docker (127.0.0.11) : sans ça, nginx
# résout le nom du service UNE SEULE FOIS au démarrage, et plante en boucle
# si ce service n'est pas encore prêt à cet instant précis (ordre de
# démarrage non garanti entre conteneurs). Avec une variable, la résolution
# se fait à chaque requête — nginx démarre toujours, et renvoie juste une
# 502 le temps que le service visé soit disponible.
#
# Résolution locale requise (/etc/hosts) :
#   127.0.0.1  wagadu.local cms.wagadu.local intranet.wagadu.local

resolver 127.0.0.11 valid=10s;

server {
	listen 80;
	server_name wagadu.local;

	location / {
		set $upstream_site http://site:3000;
		proxy_pass $upstream_site;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		# HMR Next.js (WebSocket) en dev.
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
	}
}

server {
	listen 80;
	server_name cms.wagadu.local;
	client_max_body_size 50m;

	location / {
		set $upstream_directus http://directus:8055;
		proxy_pass $upstream_directus;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}

server {
	listen 80;
	server_name intranet.wagadu.local;
	client_max_body_size 20m;

	# API, admin Django, médias/statiques → le backend directement (le
	# frontend Next.js proxifie déjà /api et /media via INTERNAL_API_URL,
	# mais /django-admin et /static n'existent que côté backend).
	location ~ ^/(api|django-admin|media|static)/ {
		set $upstream_backend http://intranet-backend:8000;
		proxy_pass $upstream_backend;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location / {
		set $upstream_frontend http://intranet-frontend:3000;
		proxy_pass $upstream_frontend;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}
